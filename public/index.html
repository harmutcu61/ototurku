<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ototurkuaz | Bakım &amp; Disk-Balata Fiyatları</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0C;
    --panel:#171718;
    --panel-light:#212122;
    --text:#F2F2F2;
    --text-dim:#98989B;
    --accent:#E4132A;
    --accent-text:#FFFFFF;
    --divider:#2C2C2E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:96px; line-height:1.4;
  }
  a{color:inherit;}

  header{padding:28px 20px 22px;border-bottom:1px solid var(--divider);}
  .brandmark{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .brandmark .mark{
    width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;font-weight:800;
    font-size:16px;flex-shrink:0;letter-spacing:-0.02em;
  }
  .brandmark .names{display:flex;flex-direction:column;}
  .brandmark .brand{font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .brandmark .sub{font-size:12.5px;color:var(--text-dim);margin-top:1px;}
  h1{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  header p.lead{font-size:14px;color:var(--text-dim);margin:0;max-width:34ch;}

  section.selector{padding:22px 20px 6px;}
  .field-label{font-size:13px;color:var(--text-dim);margin-bottom:9px;}

  .chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{
    background:#FFFFFF;
    border-radius:12px;
    border:2px solid transparent;
    padding:8px 12px;
    display:flex;align-items:center;gap:8px;
    cursor:pointer;
    min-width:84px;
    transition:border-color .15s ease, transform .1s ease;
  }
  .chip.active{border-color:var(--accent);}
  .chip:active{transform:scale(0.97);}
  .chip img{height:22px;max-width:64px;width:auto;object-fit:contain;display:block;}
  .chip .fallback{display:flex;align-items:center;gap:7px;}
  .chip .fallback .badge{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9.5px;font-weight:800;
  }
  .chip .fallback .bname{color:#141414;font-size:13px;font-weight:700;}

  select#engineSelect{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--divider);
    background:var(--panel);color:var(--text);font-size:15px;font-family:inherit;
    margin-bottom:8px;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(1em + 2px), calc(100% - 15px) calc(1em + 2px);
    background-size: 5px 5px, 5px 5px;background-repeat:no-repeat;
  }

  section.block{padding:26px 20px 6px;}
  .block h2{font-size:16px;font-weight:700;margin:0 0 3px;}
  .block p.hint{font-size:13px;color:var(--text-dim);margin:0 0 16px;}

  .item-card{
    background:var(--panel);border:1px solid var(--divider);border-radius:var(--radius);
    padding:15px 16px;margin-bottom:12px;
  }
  .item-card .iname{font-size:15px;font-weight:600;}
  .item-card .idesc{font-size:12.5px;color:var(--text-dim);margin:2px 0 11px;}
  .tier-row{display:flex;gap:7px;}
  .tier-btn{
    flex:1;min-width:0;padding:10px 6px;border-radius:9px;border:1px solid var(--divider);
    background:var(--bg);cursor:pointer;text-align:center;transition:border-color .15s ease, background .15s ease;
  }
  .tier-btn.active{border-color:var(--accent);background:var(--panel-light);}
  .tier-btn .tlabel{font-size:11px;color:var(--text-dim);line-height:1.25;}
  .tier-btn.active .tlabel{color:var(--text);}
  .tier-btn .tprice{font-size:13.5px;font-weight:700;margin-top:4px;}

  .fineprint{padding:22px 20px 4px;font-size:12px;color:var(--text-dim);}

  .sticky-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--divider);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
  }
  .sticky-bar .totals{flex:1;min-width:0;}
  .sticky-bar .totals .count{font-size:12px;color:var(--text-dim);}
  .sticky-bar .totals .sum{font-size:18px;font-weight:800;}
  .sticky-bar button{
    background:var(--accent);color:var(--accent-text);border:none;border-radius:10px;padding:13px 18px;
    font-size:14.5px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:8px;
    cursor:pointer;white-space:nowrap;
  }
  .sticky-bar button:disabled{opacity:.4;cursor:default;}
  .sticky-bar button svg{width:17px;height:17px;flex-shrink:0;}

  .loading-msg{padding:40px 20px;color:var(--text-dim);font-size:14px;text-align:center;}
</style>
</head>
<body>

<div id="app"><div class="loading-msg">Yükleniyor…</div></div>

<script>
const waSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.2 0 4.26.86 5.82 2.42a8.2 8.2 0 0 1 2.41 5.82c0 4.54-3.7 8.24-8.24 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24m-4.53 4.2c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.03s.87 2.36.99 2.52c.12.16 1.7 2.72 4.2 3.7.59.24 1.05.38 1.4.49.59.19 1.13.16 1.55.1.47-.07 1.46-.6 1.67-1.18.2-.58.2-1.07.14-1.18-.06-.1-.22-.16-.46-.28-.24-.12-1.46-.72-1.68-.8-.23-.08-.39-.12-.56.12-.16.24-.64.8-.78.97-.15.16-.29.18-.53.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.35-1.67-.14-.24-.02-.37.11-.49.11-.11.24-.29.36-.43.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.56-1.36-.77-1.86-.2-.48-.4-.42-.56-.42h-.42z"/></svg>';

let DATA = null;
let state = { brand: null, engine: null, selected: new Set() };

function fmt(n){ return n.toLocaleString('tr-TR') + ' ₺'; }

function shortLabel(name){
  const words = name.trim().split(/\s+/);
  if (words.length > 1) return words.map(w => w[0]).join('').toUpperCase().slice(0,3);
  return name.slice(0,4).toUpperCase();
}

function calcPrice(base, brandMult, engineFactor, tierMult){
  return Math.round(base * brandMult * engineFactor * tierMult / 50) * 50;
}

function currentEngineFactor(){
  const eng = DATA.brands[state.brand].engines.find(e => e.name === state.engine);
  return eng ? eng.factor : 1.0;
}

function buildLayout(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div class="brandmark">
        <div class="mark">OT</div>
        <div class="names">
          <div class="brand">${DATA.meta.shopName}</div>
          <div class="sub">${DATA.meta.subBrand}</div>
        </div>
      </div>
      <h1>${DATA.meta.tagline}</h1>
      <p class="lead">${DATA.meta.lead}</p>
    </header>

    <section class="selector">
      <div class="field-label">Marka</div>
      <div class="chip-row" id="brandChips"></div>
      <div class="field-label">Motor tipi</div>
      <select id="engineSelect"></select>
    </section>

    <div id="sectionsHost"></div>

    <p class="fineprint">
      Fiyatlar örnek/taslak niteliğindedir ve güncel liste ile değişebilir. Kesin fiyat için servis danışmanımız teyit eder.
    </p>

    <div class="sticky-bar">
      <div class="totals">
        <div class="count" id="sumCount">Henüz seçim yok</div>
        <div class="sum" id="sumTotal">0 ₺</div>
      </div>
      <button id="sendBtn" disabled>${waSvg} WhatsApp'tan talep gönder</button>
    </div>
  `;

  const sectionsHost = document.getElementById('sectionsHost');
  Object.keys(DATA.sections).forEach(key => {
    const sec = DATA.sections[key];
    const block = document.createElement('section');
    block.className = 'block';
    block.innerHTML = `<h2>${sec.title}</h2>${sec.hint ? `<p class="hint">${sec.hint}</p>` : ''}<div id="sec-${key}"></div>`;
    sectionsHost.appendChild(block);
  });
}

function renderBrandChips(){
  const brandChips = document.getElementById('brandChips');
  brandChips.innerHTML = '';
  Object.keys(DATA.brands).forEach(brand => {
    const b = DATA.brands[brand];
    const chip = document.createElement('div');
    chip.className = 'chip' + (brand === state.brand ? ' active' : '');
    chip.innerHTML = `
      <img src="${b.logo || ''}" alt="${brand}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="fallback" style="display:none;">
        <div class="badge" style="background:${b.color}">${shortLabel(brand)}</div>
        <div class="bname">${brand}</div>
      </div>
    `;
    chip.onclick = () => {
      state.brand = brand;
      state.engine = DATA.brands[brand].engines[0].name;
      state.selected.clear();
      renderAll();
    };
    brandChips.appendChild(chip);
  });
}

function renderEngineSelect(){
  const engineSelect = document.getElementById('engineSelect');
  engineSelect.innerHTML = '';
  DATA.brands[state.brand].engines.forEach(eng => {
    const opt = document.createElement('option');
    opt.value = eng.name;
    opt.textContent = eng.name;
    if (eng.name === state.engine) opt.selected = true;
    engineSelect.appendChild(opt);
  });
  engineSelect.onchange = (e) => {
    state.engine = e.target.value;
    state.selected.clear();
    renderAll();
  };
}

function renderSection(sectionKey){
  const mult = DATA.brands[state.brand].multiplier;
  const factor = currentEngineFactor();
  const container = document.getElementById('sec-' + sectionKey);
  if (!container) return;
  container.innerHTML = '';
  DATA.sections[sectionKey].items.forEach((item, ii) => {
    const card = document.createElement('div');
    card.className = 'item-card';
    const tierRow = document.createElement('div');
    tierRow.className = 'tier-row';
    DATA.tiers.forEach((t, ti) => {
      const key = sectionKey + ':' + ii + ':' + ti;
      const price = calcPrice(item.base, mult, factor, t.mult);
      const btn = document.createElement('div');
      btn.className = 'tier-btn' + (state.selected.has(key) ? ' active' : '');
      btn.innerHTML = `<div class="tlabel">${t.tier}</div><div class="tprice">${fmt(price)}</div>`;
      btn.onclick = () => {
        DATA.tiers.forEach((_, k) => state.selected.delete(sectionKey + ':' + ii + ':' + k));
        if (!state.selected.has(key)) state.selected.add(key);
        renderAll();
      };
      tierRow.appendChild(btn);
    });
    card.innerHTML = `<div class="iname">${item.name}</div><div class="idesc">${item.desc}</div>`;
    card.appendChild(tierRow);
    container.appendChild(card);
  });
}

function renderSummary(){
  const mult = DATA.brands[state.brand].multiplier;
  const factor = currentEngineFactor();
  const sumCount = document.getElementById('sumCount');
  const sumTotal = document.getElementById('sumTotal');
  const sendBtn = document.getElementById('sendBtn');
  let total = 0;
  let items = [];
  state.selected.forEach(key => {
    const [sectionKey, iiStr, tiStr] = key.split(':');
    const ii = parseInt(iiStr, 10);
    const ti = parseInt(tiStr, 10);
    const item = DATA.sections[sectionKey].items[ii];
    const t = DATA.tiers[ti];
    const price = calcPrice(item.base, mult, factor, t.mult);
    total += price;
    items.push(item.name + ' — ' + t.tier);
  });

  if (items.length === 0) {
    sumCount.textContent = 'Henüz seçim yok';
    sendBtn.disabled = true;
  } else {
    sumCount.textContent = items.length + ' kalem seçildi';
    sendBtn.disabled = false;
  }
  sumTotal.textContent = fmt(total);

  sendBtn.onclick = () => {
    const lines = [
      `Merhaba, ${DATA.meta.shopName} üzerinden fiyat talebi bırakmak istiyorum.`,
      ``,
      `Araç: ${state.brand} — ${state.engine}`,
      `Seçilen kalemler:`,
      ...items.map(i => `• ${i}`),
      ``,
      `Tahmini toplam: ${fmt(total)}`,
      `(Fiyatlar teyide tabidir.)`
    ];
    const text = encodeURIComponent(lines.join('\n'));
    window.open(`https://wa.me/${DATA.meta.whatsapp}?text=${text}`, '_blank');
  };
}

function renderAll(){
  renderBrandChips();
  renderEngineSelect();
  Object.keys(DATA.sections).forEach(renderSection);
  renderSummary();
}

fetch('/api/prices')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    state.brand = Object.keys(DATA.brands)[0];
    state.engine = DATA.brands[state.brand].engines[0].name;
    buildLayout();
    renderAll();
  })
  .catch(() => {
    document.getElementById('app').innerHTML = '<div class="loading-msg">Fiyatlar yüklenemedi. Sunucunun çalıştığından emin olun.</div>';
  });
</script>
</body>
</html>
